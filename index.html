<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <title>NCIPS Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ncipsYellow: '#FFD700', ncipsNavy: '#0F172A', ncipsGold: '#D4AF37' } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col relative overflow-hidden">
    
    <!-- LAYAR LOGIN -->
    <div id="login-screen" class="absolute inset-0 bg-ncipsNavy z-50 flex flex-col justify-center items-center p-6 transition-opacity duration-500">
        <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-ncipsYellow">NCIPS</h1>
                <p class="text-xs text-gray-500 font-bold tracking-widest mt-1">SUPER APP</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Email</label>
                    <input type="email" id="email" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Password</label>
                    <input type="password" id="password" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow" required>
                </div>
                <p id="login-error" class="text-xs text-red-500 text-center hidden">Error</p>
                <button type="submit" id="btn-login" class="w-full bg-ncipsYellow text-ncipsNavy font-bold py-3 rounded-xl shadow-lg mt-2">Masuk</button>
            </form>
        </div>
    </div>

    <!-- KONTEN APLIKASI -->
    <div id="app-content" class="hidden flex-col h-full">
        <!-- Header -->
        <header class="bg-ncipsNavy px-4 py-4 shadow-md flex justify-between items-center z-10">
            <div>
                <h1 class="text-xl font-black text-ncipsYellow leading-none">NCIPS</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="user-role-badge" class="bg-ncipsYellow text-ncipsNavy px-3 py-1 rounded-full text-[10px] font-black shadow tracking-wider uppercase">...</span>
                <button onclick="logout()" class="text-gray-400 hover:text-white transition">Keluar</button>
            </div>
        </header>

        <!-- HALAMAN 1: BERANDA -->
        <main id="view-home" class="flex-1 overflow-y-auto p-4 space-y-4 pb-28 block">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-ncipsYellow rounded-full opacity-20"></div>
                <h2 id="user-greeting" class="text-lg font-bold text-ncipsNavy">Memuat...</h2>
                <p id="user-email-display" class="text-xs text-gray-500 mt-1">...</p>
            </div>
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl mt-4">
                <p class="text-xs text-blue-800 font-medium">💡 Klik menu <b>Scan QR</b> di bawah untuk membuka kamera piket harian.</p>
            </div>
        </main>

        <!-- HALAMAN 2: SCANNER -->
        <main id="view-scanner" class="flex-1 overflow-y-auto p-4 pb-28 hidden flex-col">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                <h2 class="text-lg font-bold text-ncipsNavy mb-1">Kamera Piket</h2>
                <p class="text-xs text-gray-500 mb-4">Arahkan kamera ke ID Card Siswa/Guru</p>
                
                <div id="reader" class="w-full rounded-xl overflow-hidden border-2 border-ncipsYellow bg-gray-100 min-h-[250px]"></div>
                
                <div id="scan-result-box" class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg hidden">
                    <p class="text-xs text-green-800 font-bold mb-1">Berhasil Terbaca!</p>
                    <p id="scan-text" class="text-sm font-mono text-gray-700 break-all"></p>
                    <button onclick="startScanner()" class="mt-3 bg-ncipsNavy text-white px-4 py-2 rounded-lg text-xs font-bold w-full">Scan Lagi</button>
                </div>
            </div>
        </main>

        <!-- PERBAIKAN: Menggunakan "fixed" agar selalu menempel di layar bawah, dan "pb-6" untuk padding khusus HP -->
        <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pt-3 pb-6 px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-50">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center p-2 text-ncipsNavy">
                <span class="text-2xl mb-1">🏠</span>
                <span class="text-[10px] font-bold">Beranda</span>
            </button>
            <button onclick="switchView('scanner')" id="nav-scanner" class="flex flex-col items-center p-2 text-gray-400 hover:text-ncipsNavy transition">
                <span class="text-2xl mb-1">📷</span>
                <span class="text-[10px] font-bold">Scan QR</span>
            </button>
        </nav>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        // MASUKKAN KUNCI SUPABASE DI SINI (JANGAN LUPA!)
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(session.user);
        }
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').innerText = error.message;
                document.getElementById('login-error').classList.remove('hidden');
            } else showApp(data.user);
        });
        async function logout() { await supabaseClient.auth.signOut(); window.location.reload(); }
        
        function showApp(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').classList.add('flex');
            fetchUserProfile(user.id, user.email);
        }
        async function fetchUserProfile(userId, email) {
            const { data } = await supabaseClient.from('users').select('full_name, role').eq('id', userId).single();
            if (data) {
                document.getElementById('user-greeting').innerText = "Halo, " + data.full_name + "!";
                document.getElementById('user-email-display').innerText = email;
                document.getElementById('user-role-badge').innerText = data.role;
            }
        }
        checkSession();

        let html5QrcodeScanner = null;

        function switchView(view) {
            const viewHome = document.getElementById('view-home');
            const viewScanner = document.getElementById('view-scanner');
            const navHome = document.getElementById('nav-home');
            const navScanner = document.getElementById('nav-scanner');

            if (view === 'home') {
                viewHome.classList.remove('hidden'); viewHome.classList.add('block');
                viewScanner.classList.add('hidden'); viewScanner.classList.remove('flex');
                navHome.classList.replace('text-gray-400', 'text-ncipsNavy');
                navScanner.classList.replace('text-ncipsNavy', 'text-gray-400');
                stopScanner();
            } else {
                viewHome.classList.add('hidden'); viewHome.classList.remove('block');
                viewScanner.classList.remove('hidden'); viewScanner.classList.add('flex');
                navScanner.classList.replace('text-gray-400', 'text-ncipsNavy');
                navHome.classList.replace('text-ncipsNavy', 'text-gray-400');
                startScanner();
            }
        }

        function startScanner() {
            document.getElementById('scan-result-box').classList.add('hidden');
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    stopScanner();
                    document.getElementById('scan-result-box').classList.remove('hidden');
                    document.getElementById('scan-text').innerText = decodedText;
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("Gagal mengakses kamera. Pastikan Anda memberi izin kamera pada browser!");
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().catch(err => console.error(err));
            }
        }
    </script>
</body>
</html>
