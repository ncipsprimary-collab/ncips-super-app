<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>NCIPS Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ncipsYellow: '#FFD700', ncipsNavy: '#0F172A', ncipsGold: '#D4AF37' } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col relative overflow-hidden">
    
    <!-- LAYAR LOGIN -->
    <div id="login-screen" class="absolute inset-0 bg-ncipsNavy z-50 flex flex-col justify-center items-center p-6 transition-opacity duration-500">
        <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-ncipsYellow">NCIPS</h1>
                <p class="text-xs text-gray-500 font-bold tracking-widest mt-1">SUPER APP</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Email Pengguna</label>
                    <input type="email" id="email" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Kata Sandi</label>
                    <input type="password" id="password" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow" required>
                </div>
                <p id="login-error" class="text-xs text-red-500 text-center hidden">Terjadi kesalahan.</p>
                <button type="submit" id="btn-login" class="w-full bg-ncipsYellow text-ncipsNavy font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg mt-2">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- KONTEN APLIKASI UTAMA -->
    <div id="app-content" class="hidden flex-col h-full">
        <!-- Header -->
        <header class="bg-ncipsNavy px-4 py-4 shadow-md flex justify-between items-center z-10">
            <div>
                <h1 class="text-xl font-black text-ncipsYellow leading-none">NCIPS</h1>
                <p class="text-[10px] text-ncipsGold tracking-widest mt-1">SUPER APP</p>
            </div>
            <div class="flex items-center gap-3">
                <!-- Lencana Role -->
                <span id="user-role-badge" class="bg-ncipsYellow text-ncipsNavy px-3 py-1 rounded-full text-[10px] font-black shadow tracking-wider uppercase">
                    ...
                </span>
                <button onclick="logout()" class="text-gray-400 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
            <!-- Kartu Profil -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-ncipsYellow rounded-full opacity-20"></div>
                <h2 id="user-greeting" class="text-lg font-bold text-ncipsNavy">Menyiapkan profil...</h2>
                <p id="user-email-display" class="text-xs text-gray-500 mt-1">Menarik data dari database</p>
            </div>
            
            <!-- Grid Menu -->
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </div>
                    <span class="text-xs font-semibold text-gray-700">Data Siswa</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                    <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-xs font-semibold text-gray-700">Scan Piket</span>
                </div>
            </div>
        </main>

        <!-- Bottom Nav -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe pt-2 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
            <a href="#" class="flex flex-col items-center p-2 text-ncipsNavy">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-semibold">Beranda</span>
            </a>
            <a href="#" class="flex flex-col items-center p-2 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] font-medium">Laporan</span>
            </a>
        </nav>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        // MASUKKAN KUNCI DARI NOTEPAD DI SINI SEPERTI BIASA
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginScreen = document.getElementById('login-screen');
        const appContent = document.getElementById('app-content');
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('login-error');

        // Pengecekan sesi awal
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp(session.user);
            }
        }

        // Proses Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.innerText = 'Memeriksa...';
            errorMsg.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.innerText = "Error: " + error.message;
                errorMsg.classList.remove('hidden');
                btnLogin.innerText = 'Masuk';
            } else {
                showApp(data.user);
            }
        });

        // Proses Logout
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // Menampilkan UI Aplikasi
        function showApp(user) {
            loginScreen.classList.add('hidden');
            appContent.classList.remove('hidden');
            appContent.classList.add('flex');
            
            // Panggil fungsi untuk mengambil nama & role dari database
            fetchUserProfile(user.id, user.email);
        }

        // FUNGSI BARU: Mengambil profil dari tabel users
        async function fetchUserProfile(userId, email) {
            try {
                // Kueri ke tabel 'users' untuk mencocokkan ID
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('full_name, role')
                    .eq('id', userId)
                    .single(); // Ambil 1 data spesifik

                if (error) throw error;

                if (data) {
                    // Update tampilan teks di HTML
                    document.getElementById('user-greeting').innerText = "Halo, " + data.full_name + "!";
                    document.getElementById('user-email-display').innerText = email;
                    document.getElementById('user-role-badge').innerText = data.role;
                }
            } catch (err) {
                console.error("Gagal menarik data profil:", err);
                document.getElementById('user-greeting').innerText = "Halo, Pengguna Baru!";
                document.getElementById('user-email-display').innerText = email;
                document.getElementById('user-role-badge').innerText = "GUEST";
            }
        }

        checkSession();
    </script>
</body>
</html>
