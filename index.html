<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCIPS Super App - Nusa Cendana International Plus School</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Pustaka Pendukung (PapaParse, SheetJS, HTML5-QRCode) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- SCREEN: LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-blue-900 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-900">NCIPS Super App</h1>
                <p class="text-sm text-gray-500 mt-1">Nusa Cendana International Plus School</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email / Username</label>
                    <input type="text" id="login-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan email anda">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    Masuk ke Sistem
                </button>
            </form>
            <div id="login-error" class="mt-4 text-center text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <!-- SCREEN: UTAMA APLIKASI (DASHBOARD) -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-blue-900 text-white shadow-md p-4 flex justify-between items-center">
            <h2 class="font-bold text-lg">NCIPS Dashboard</h2>
            <button id="btn-logout" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm font-medium transition">Keluar</button>
        </header>

        <!-- Konten Utama -->
        <main class="flex-1 p-6 max-w-6xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow p-6 mb-6">
                <h3 class="text-xl font-bold text-blue-900 mb-2">Selamat Datang di NCIPS Super App</h3>
                <p class="text-gray-600">Sistem terintegrasi administrasi sekolah, absensi, dan manajemen data siswa.</p>
            </div>
        </main>
    </div>

    <!-- Skrip Inisialisasi & Logika Utama -->
    <script>
        // Konfigurasi Supabase (Sesuaikan URL dan Anon Key Anda)
        const SUPABASE_URL = 'https://URL_SUPABASE_ANDA.supabase.co';
        const SUPABASE_ANON_KEY = 'KUNCI_ANON_SUPABASE_ANDA';
        
        // Inisialisasi Klien Supabase secara Global agar bisa diakses oleh setting.js
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app-screen');
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const btnLogout = document.getElementById('btn-logout');

            // Cek Sesi Aktif
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                // Contoh pemanggilan fungsi dari setting.js setelah login berhasil
                if (typeof loadSystemSettings === 'function') {
                    loadSystemSettings().then(settings => console.log('Pengaturan dimuat:', settings));
                }
            }

            // Handler Proses Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.classList.add('hidden');
                
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    loginError.textContent = error.message;
                    loginError.classList.remove('hidden');
                    return;
                }

                // Jika Berhasil Login
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
            });

            // Handler Logout
            btnLogout.addEventListener('click', async () => {
                await window.supabaseClient.auth.signOut();
                window.location.reload();
            });
        });
    </script>

    <!-- Panggil file setting.js (Pastikan berada di folder yang sama dengan index.html) -->
    <script src="setting.js"></script>
</body>
</html>
