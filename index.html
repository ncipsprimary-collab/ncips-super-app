<!-- SCRIPT LOGIKA -->
    <script>
        // MASUKKAN KUNCI SUPABASE DI SINI (JANGAN LUPA!)
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(session.user);
        }
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerText = 'Memeriksa...';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').innerText = error.message;
                document.getElementById('login-error').classList.remove('hidden');
                btn.innerText = 'Masuk';
            } else showApp(data.user);
        });

        async function logout() { await supabaseClient.auth.signOut(); window.location.reload(); }
        
        function showApp(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').classList.add('flex');
            fetchUserProfile(user.id, user.email);
        }

        async function fetchUserProfile(userId, email) {
            const { data } = await supabaseClient.from('users').select('full_name, role').eq('id', userId).single();
            if (data) {
                document.getElementById('user-greeting').innerText = data.full_name;
                document.getElementById('user-email-display').innerText = email;
                document.getElementById('user-role-badge').innerText = data.role;
            }
        }
        
        checkSession();

        let html5QrcodeScanner = null;

        function switchView(view) {
            const viewHome = document.getElementById('view-home');
            const viewScanner = document.getElementById('view-scanner');
            const navHome = document.getElementById('nav-home');
            const navScanner = document.getElementById('nav-scanner');

            if (view === 'home') {
                viewHome.classList.remove('hidden'); viewHome.classList.add('block');
                viewScanner.classList.add('hidden'); viewScanner.classList.remove('flex');
                
                navHome.classList.replace('text-gray-400', 'text-ncipsNavy');
                navHome.classList.add('scale-105');
                navHome.querySelector('span').classList.replace('font-bold', 'font-black');
                
                navScanner.classList.replace('text-ncipsNavy', 'text-gray-400');
                navScanner.classList.remove('scale-105');
                navScanner.querySelector('span').classList.replace('font-black', 'font-bold');
                stopScanner();
            } else {
                viewHome.classList.add('hidden'); viewHome.classList.remove('block');
                viewScanner.classList.remove('hidden'); viewScanner.classList.add('flex');
                
                navScanner.classList.replace('text-gray-400', 'text-ncipsNavy');
                navScanner.classList.add('scale-105');
                navScanner.querySelector('span').classList.replace('font-bold', 'font-black');
                
                navHome.classList.replace('text-ncipsNavy', 'text-gray-400');
                navHome.classList.remove('scale-105');
                navHome.querySelector('span').classList.replace('font-black', 'font-bold');
                startScanner();
            }
        }

        function startScanner() {
            document.getElementById('scan-result-box').classList.add('hidden');
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    stopScanner();
                    prosesDataKehadiran(decodedText);
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("Gagal mengakses kamera. Pastikan izin kamera aktif!");
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().catch(err => console.error(err));
            }
        }

        async function prosesDataKehadiran(qrText) {
            const resultBox = document.getElementById('scan-result-box');
            const iconDiv = document.getElementById('scan-icon');
            const titleText = document.getElementById('scan-title');
            const detailText = document.getElementById('scan-text');

            resultBox.classList.remove('hidden');
            titleText.innerText = "Mencari data...";
            detailText.innerText = "Mohon tunggu sebentar.";
            iconDiv.className = "w-12 h-12 bg-gray-200 animate-pulse rounded-full mx-auto mb-3";
            iconDiv.innerHTML = "";

            // PERBAIKAN: Membersihkan spasi siluman di teks QR Code
            const cleanQrText = qrText.trim(); 

            try {
                // 1. Cari data siswa
                const { data: student, error: searchError } = await supabaseClient
                    .from('students')
                    .select('id, full_name')
                    .eq('qr_code', cleanQrText)
                    .single();

                if (searchError) {
                    throw new Error("Gagal cari siswa: " + searchError.message);
                }

                if (!student) {
                    throw new Error("Siswa tidak ditemukan.");
                }

                // 2. Ambil ID Akun Admin/Guru
                const { data: authData } = await supabaseClient.auth.getUser();
                
                // 3. Simpan Kehadiran
                const { error: insertError } = await supabaseClient
                    .from('attendances')
                    .insert([
                        {
                            person_type: 'SISWA',
                            student_id: student.id,
                            status: 'HADIR',
                            scanned_by: authData.user.id
                        }
                    ]);

                if (insertError) {
                    throw new Error("Gagal absen: " + insertError.message);
                }

                // Sukses!
                iconDiv.className = "w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-green-500/30";
                iconDiv.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                titleText.className = "text-sm text-green-700 font-bold mb-2 text-center";
                titleText.innerText = "Berhasil Dicatat!";
                detailText.innerHTML = `<strong class="text-ncipsNavy text-lg">${student.full_name}</strong><br>Status: HADIR`;

            } catch (err) {
                console.error(err);
                iconDiv.className = "w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-red-500/30";
                iconDiv.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                titleText.className = "text-sm text-red-700 font-bold mb-2 text-center";
                titleText.innerText = "Error Sistem";
                // PERBAIKAN: Menampilkan error langsung dari Supabase agar kita tahu penyebabnya
                detailText.innerHTML = `<strong>Teks QR:</strong> "${cleanQrText}"<br><strong>Pesan:</strong> ${err.message}`;
            }
        }
    </script>
</body>
</html>
