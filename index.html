<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCIPS Super App</title>
    <!-- Memanggil Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memanggil Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncipsYellow: '#FFD700', // Kuning Cerah
                        ncipsNavy: '#0F172A', // Biru Donker
                        ncipsGold: '#D4AF37' // Emas
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans flex min-h-screen">
    
    <!-- Sidebar Kiri -->
    <aside class="w-64 bg-ncipsNavy text-white flex flex-col shadow-xl">
        <div class="p-6 text-center border-b border-gray-700">
            <h1 class="text-3xl font-black text-ncipsYellow">NCIPS</h1>
            <p class="text-sm text-ncipsGold tracking-widest mt-1">SUPER APP</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="#" class="block px-4 py-3 bg-ncipsYellow text-ncipsNavy font-bold rounded-lg shadow">Dashboard Utama</a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-800 text-gray-300 font-medium rounded-lg transition">Scanner Presensi</a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-800 text-gray-300 font-medium rounded-lg transition">Dokumen Akademik</a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-800 text-gray-300 font-medium rounded-lg transition">Keuangan Sekolah</a>
        </nav>
        <div class="p-4 border-t border-gray-700 text-xs text-gray-400 text-center">
            &copy; 2026 YPKR
        </div>
    </aside>

    <!-- Konten Utama Kanan -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h2 class="text-2xl font-bold text-ncipsNavy">Dashboard Informasi</h2>
                <p class="text-gray-500 text-sm">Sistem Manajemen Sekolah Terpadu</p>
            </div>
            <span class="bg-ncipsYellow text-ncipsNavy px-5 py-2 rounded-full font-bold shadow-sm">
                Role: Admin
            </span>
        </header>

        <!-- Kartu Statistik -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-ncipsYellow">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Total Siswa</h3>
                <p class="text-4xl font-black text-ncipsNavy mt-2">--</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-ncipsGold">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Hadir Hari Ini</h3>
                <p class="text-4xl font-black text-ncipsNavy mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-ncipsNavy">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Status Keuangan</h3>
                <p class="text-xl font-bold text-green-600 mt-2 mt-4">Terkendali</p>
            </div>
        </div>

        <!-- Panel Koneksi Database -->
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-ncipsNavy mb-2">Status Koneksi Supabase</h3>
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                <p id="db-status" class="text-gray-600 font-medium">Memeriksa koneksi database...</p>
            </div>
        </div>
    </main>

    <!-- SCRIPT LOGIKA APLIKASI -->
    <script>
        // 1. MASUKKAN KUNCI SUPABASE DI BAWAH INI
        // Ganti teks di dalam tanda kutip dengan kunci dari Notepad
        
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';

        // 2. Inisialisasi Koneksi
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Fungsi untuk mengecek database
        async function checkConnection() {
            const statusText = document.getElementById('db-status');
            try {
                // Mencoba mengambil data dari tabel 'classes' yang tadi mas bro buat
                const { data, error } = await supabase.from('classes').select('*');
                
                if (error) throw error;
                
                if(data && data.length > 0) {
                    statusText.innerHTML = "✅ Berhasil terhubung ke Supabase! Data kelas ditemukan: <strong>" + data[0].name + "</strong>";
                    statusText.className = "text-green-600 font-bold";
                } else {
                    statusText.innerHTML = "✅ Berhasil terhubung! Tabel ditemukan, tapi data kelas masih kosong.";
                    statusText.className = "text-yellow-600 font-bold";
                }
            } catch (err) {
                console.error(err);
                statusText.innerHTML = "❌ Gagal terhubung. Pastikan URL dan Anon Key sudah dimasukkan dengan benar.";
                statusText.className = "text-red-600 font-bold";
            }
        }

        // Jalankan pengecekan jika kunci sudah diubah
        if(SUPABASE_URL !== 'MASUKKAN_URL_SUPABASE_DI_SINI') {
            checkConnection();
        } else {
            document.getElementById('db-status').innerHTML = "⚠️ MENUNGGU KUNCI: Silakan ganti SUPABASE_URL dan SUPABASE_ANON_KEY di dalam kode.";
        }
    </script>
</body>
</html>
