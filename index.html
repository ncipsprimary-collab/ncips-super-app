<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>NCIPS Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ncipsYellow: '#FFD700', ncipsNavy: '#0F172A', ncipsGold: '#D4AF37' } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col relative overflow-hidden">
    
    <!-- LAYAR LOGIN -->
    <div id="login-screen" class="absolute inset-0 bg-ncipsNavy z-50 flex flex-col justify-center items-center p-6 transition-opacity duration-500">
        <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-ncipsYellow">NCIPS</h1>
                <p class="text-xs text-gray-500 font-bold tracking-widest mt-1">SUPER APP</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Email Pengguna</label>
                    <input type="email" id="email" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow focus:ring-1 focus:ring-ncipsYellow" placeholder="admin@ypkr.com" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-ncipsNavy">Kata Sandi</label>
                    <input type="password" id="password" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-ncipsYellow focus:ring-1 focus:ring-ncipsYellow" placeholder="••••••••" required>
                </div>
                <p id="login-error" class="text-xs text-red-500 text-center hidden">Email atau password salah.</p>
                <button type="submit" id="btn-login" class="w-full bg-ncipsYellow text-ncipsNavy font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg mt-2">
                    Masuk
                </button>
            </form>
        </div>
        <p class="text-gray-400 text-[10px] mt-8">&copy; 2026 Yayasan Pendidikan Kristo Regi</p>
    </div>

    <!-- KONTEN APLIKASI (Sembunyi sebelum login) -->
    <div id="app-content" class="hidden flex-col h-full">
        <!-- Header -->
        <header class="bg-ncipsNavy px-4 py-4 shadow-md flex justify-between items-center z-10">
            <div>
                <h1 class="text-xl font-black text-ncipsYellow leading-none">NCIPS</h1>
                <p class="text-[10px] text-ncipsGold tracking-widest mt-1">SUPER APP</p>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow">
                Keluar
            </button>
        </header>

        <!-- Main Dashboard -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-ncipsYellow rounded-full opacity-20"></div>
                <h2 class="text-lg font-bold text-ncipsNavy">Selamat Datang!</h2>
                <p id="user-email-display" class="text-xs text-gray-500 mt-1">Loading...</p>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 mt-4">
                <h3 class="text-sm font-bold text-ncipsNavy mb-1">Status Keamanan</h3>
                <p class="text-xs text-gray-500">Aplikasi telah diamankan dengan sistem login Supabase.</p>
            </div>
        </main>

        <!-- Bottom Nav -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe pt-2 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
            <a href="#" class="flex flex-col items-center p-2 text-ncipsNavy"><span class="text-[10px] font-semibold">Beranda</span></a>
            <a href="#" class="flex flex-col items-center p-2 text-gray-400"><span class="text-[10px] font-medium">Scan QR</span></a>
        </nav>
    </div>

    <!-- SCRIPT LOGIKA -->
    <!-- SCRIPT LOGIKA -->
    <script>
        // MASUKKAN KUNCI DARI NOTEPAD DI SINI
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginScreen = document.getElementById('login-screen');
        const appContent = document.getElementById('app-content');
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('login-error');

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp(session.user.email);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.innerText = 'Memeriksa...';
            errorMsg.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    // INI YANG DIUBAH: Menampilkan pesan error asli dari Supabase
                    errorMsg.innerText = "INFO ERROR: " + error.message;
                    errorMsg.classList.remove('hidden');
                    btnLogin.innerText = 'Masuk';
                } else {
                    showApp(data.user.email);
                }
            } catch (err) {
                errorMsg.innerText = "SISTEM ERROR: " + err.message;
                errorMsg.classList.remove('hidden');
                btnLogin.innerText = 'Masuk';
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        function showApp(email) {
            loginScreen.classList.add('hidden');
            appContent.classList.remove('hidden');
            appContent.classList.add('flex');
            document.getElementById('user-email-display').innerText = email;
        }

        checkSession();
    </script>
</body>
</html>
