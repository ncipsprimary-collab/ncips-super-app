<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag khusus agar terasa seperti aplikasi HP asli (tidak bisa di-zoom sembarangan) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>NCIPS Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncipsYellow: '#FFD700',
                        ncipsNavy: '#0F172A',
                        ncipsGold: '#D4AF37'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-20"> <!-- pb-20 memberi ruang agar konten tidak tertutup menu bawah -->
    
    <!-- Header Aplikasi (Top Bar) -->
    <header class="bg-ncipsNavy px-4 py-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-ncipsYellow leading-none">NCIPS</h1>
            <p class="text-[10px] text-ncipsGold tracking-widest mt-1">SUPER APP - YPKR</p>
        </div>
        <div class="bg-ncipsYellow text-ncipsNavy px-3 py-1 rounded-full text-xs font-bold shadow">
            Admin
        </div>
    </header>

    <!-- Konten Utama (Scrollable) -->
    <main class="p-4 space-y-4">
        
        <!-- Kartu Sambutan -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-ncipsYellow rounded-full opacity-20"></div>
            <h2 class="text-lg font-bold text-ncipsNavy">Selamat Datang, Mas Bro!</h2>
            <p class="text-xs text-gray-500 mt-1">Pantau seluruh aktivitas sekolah dari genggaman.</p>
        </div>

        <!-- Grid Menu Pintasan (Seperti ikon aplikasi) -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                <span class="text-xs font-semibold text-gray-700">Data Siswa</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="text-xs font-semibold text-gray-700">Kehadiran</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                <div class="w-10 h-10 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="text-xs font-semibold text-gray-700">Keuangan</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center active:bg-gray-50 transition">
                <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <span class="text-xs font-semibold text-gray-700">Akademik</span>
            </div>
        </div>

        <!-- Panel Koneksi Database -->
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-ncipsNavy mt-4">
            <h3 class="text-sm font-bold text-ncipsNavy mb-1">Status Database</h3>
            <p id="db-status" class="text-xs text-gray-500">Memeriksa koneksi ke Supabase...</p>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Menu Bawah ala Android) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe pt-2 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-50">
        <a href="#" class="flex flex-col items-center p-2 text-ncipsNavy">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            <span class="text-[10px] font-semibold">Beranda</span>
        </a>
        <a href="#" class="flex flex-col items-center p-2 text-gray-400 hover:text-ncipsNavy transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            <span class="text-[10px] font-medium">Scan QR</span>
        </a>
        <a href="#" class="flex flex-col items-center p-2 text-gray-400 hover:text-ncipsNavy transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-[10px] font-medium">Laporan</span>
        </a>
        <a href="#" class="flex flex-col items-center p-2 text-gray-400 hover:text-ncipsNavy transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-medium">Profil</span>
        </a>
    </nav>

    <!-- SCRIPT LOGIKA APLIKASI -->
    <script>
        // JANGAN LUPA MASUKKAN KEMBALI KUNCI DARI NOTEPAD DI SINI
        const SUPABASE_URL = 'https://kvailwyhpvggpwlvtlxc.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_PUBqX34BtP9OmCcuQcSivQ_fo5nsQkS';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkConnection() {
            const statusText = document.getElementById('db-status');
            try {
                const { data, error } = await supabase.from('classes').select('*');
                if (error) throw error;
                if(data && data.length > 0) {
                    statusText.innerHTML = "✅ Online. Tersambung ke kelas: " + data[0].name;
                    statusText.className = "text-xs text-green-600 font-bold mt-1";
                } else {
                    statusText.innerHTML = "✅ Online. Tabel siap, data masih kosong.";
                    statusText.className = "text-xs text-yellow-600 font-bold mt-1";
                }
            } catch (err) {
                statusText.innerHTML = "❌ Gagal terhubung. Cek Kunci API.";
                statusText.className = "text-xs text-red-600 font-bold mt-1";
            }
        }

        if(SUPABASE_URL !== 'MASUKKAN_URL_SUPABASE_DI_SINI') {
            checkConnection();
        } else {
            document.getElementById('db-status').innerHTML = "⚠️ Masukkan kunci Supabase terlebih dahulu.";
            document.getElementById('db-status').className = "text-xs text-orange-600 font-bold mt-1";
        }
    </script>
</body>
</html>
